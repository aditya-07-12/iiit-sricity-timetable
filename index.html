<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <title>UG1 Timetable</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ganesh Chaturthi holiday screen */
        .ganesh-holiday {
            margin-top: 18px;
            min-height: 58vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 34px 22px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 28px;
            background: radial-gradient(circle at 50% 20%, rgba(245, 158, 11, .13), transparent 42%), #111827;
            box-shadow: 0 18px 50px rgba(0,0,0,.25);
            overflow: hidden;
            position: relative;
        }
        .ganesh-holiday::before, .ganesh-holiday::after {
            content: "";
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 1px solid rgba(245, 158, 11, .14);
        }
        .ganesh-holiday::before { top: -80px; left: -70px; }
        .ganesh-holiday::after { bottom: -95px; right: -75px; }
        .ganesh-inner { position: relative; z-index: 1; max-width: 720px; }
        .ganesh-logo {
            width: 126px;
            height: 126px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(245, 158, 11, .10);
            border: 2px solid rgba(245, 158, 11, .42);
            box-shadow: 0 0 0 10px rgba(245, 158, 11, .045), 0 16px 40px rgba(245, 158, 11, .10);
        }
        .ganesh-logo svg { width: 88px; height: 88px; }
        .ganesh-kicker { margin: 0 0 10px; font-size: .95rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
        .ganesh-title { margin: 0; font-size: clamp(2.1rem, 6vw, 4.2rem); line-height: 1.05; font-weight: 800; }
        .ganesh-title span { display: block; }
        .ganesh-message { margin: 18px auto 0; max-width: 620px; font-size: 1.08rem; line-height: 1.7; opacity: .82; }
        .ganesh-divider { width: 90px; height: 3px; margin: 24px auto; border-radius: 99px; background: currentColor; opacity: .28; }
        .ganesh-subtitle { margin: 0; font-weight: 650; font-size: 1.05rem; }
        .ganesh-date { margin-top: 8px; opacity: .62; }
        @media (max-width: 600px) {
            .ganesh-holiday { min-height: 54vh; padding: 28px 16px; border-radius: 22px; }
            .ganesh-logo { width: 108px; height: 108px; }
            .ganesh-logo svg { width: 76px; height: 76px; }
            .ganesh-message { font-size: 1rem; }
        }
    </style>
</head>
    <div class="container">
        <header class="hero">
            <div>
                <div class="eyebrow">UG1 · MONSOON 2026</div>
                <h1>
  <span id="dateBadge" class="calendar-badge">
    <span id="badgeMonth" class="badge-month">---</span>
    <span id="badgeDay" class="badge-day">--</span>
  </span> 
  My Timetable
</h1>

                <p>Find your classes, your next lecture, and free UG1 time slots.</p>
            </div>
            <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle dark mode">🌙</button>
        </header>

        <section class="search-card">
            <label for="rollNumber">Roll number</label>
            <div class="search">
                <input type="text" id="rollNumber" placeholder="e.g. S2026XXXXXXXX" autocomplete="off">
                <button id="searchButton" type="button">Get Timetable</button>
            </div>
            <div id="searchHint" class="hint">Your timetable is based on your course-wise section allocation.</div>
        </section>

        <div id="studentInfo"></div>
        <div id="dashboard"></div>
        <div id="timetable"></div>
        <div id="freeSlots"></div>
        <button id="changeRollButton" class="change-roll" type="button" hidden>↩ Change Roll Number</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
